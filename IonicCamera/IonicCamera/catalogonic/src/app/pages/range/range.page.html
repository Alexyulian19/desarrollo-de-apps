<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Range Component</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- 1. Range Básico con Iconos y Formateador de Pin -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Rango Básico con Indicador (Pin)</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-range
        [pin]="true"
        [pinFormatter]="pinFormatter"
        [(ngModel)]="valorSimple"
        color="primary">
        <ion-icon slot="start" name="volume-mute-outline"></ion-icon>
        <ion-icon slot="end" name="volume-high-outline"></ion-icon>
      </ion-range>

      <div class="ion-margin-top">
        <p><strong>Valor seleccionado:</strong> {{ valorSimple }}%</p>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- 2. Dual Knobs (Rango de Selección Mín/Máx) -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Rango Doble (Dual Knobs)</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-range
        [dualKnobs]="true"
        [pin]="true"
        [min]="0"
        [max]="100"
        [(ngModel)]="valorDual"
        color="secondary">
        <ion-label slot="start">0</ion-label>
        <ion-label slot="end">100</ion-label>
      </ion-range>

      <div class="ion-margin-top">
        <p><strong>Mínimo:</strong> {{ valorDual.lower }} | <strong>Máximo:</strong> {{ valorDual.upper }}</p>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- 3. Marcas y Saltos por Pasos (Snaps & Ticks) -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Pasos Definidos (Snaps & Ticks)</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-range
        [ticks]="true"
        [snaps]="true"
        [step]="10"
        [min]="0"
        [max]="100"
        [(ngModel)]="valorPasos"
        color="tertiary">
        <ion-icon slot="start" name="sunny-outline"></ion-icon>
        <ion-icon slot="end" name="sunny"></ion-icon>
      </ion-range>

      <div class="ion-margin-top">
        <p><strong>Nivel ajustado:</strong> {{ valorPasos }}</p>
      </div>
    </ion-card-content>
  </ion-card>

</ion-content>
