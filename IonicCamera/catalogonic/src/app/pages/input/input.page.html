<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Input Component</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Formulario de Entrada</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="full">
        <ion-item>
          <ion-input
            label="Nombre completo"
            labelPlacement="floating"
            placeholder="Ingresa tu nombre"
            [(ngModel)]="nombre">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            type="email"
            label="Correo Electrónico"
            labelPlacement="floating"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="email">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            type="tel"
            label="Teléfono"
            labelPlacement="floating"
            placeholder="300 123 4567"
            [(ngModel)]="telefono">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            [type]="mostrarClave ? 'text' : 'password'"
            label="Contraseña"
            labelPlacement="floating"
            [(ngModel)]="clave">
          </ion-input>
          <ion-button fill="clear" slot="end" (click)="toggleMostrarClave()">
            <ion-icon [name]="mostrarClave ? 'eye-off-outline' : 'eye-outline'" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  @if (nombre || email) {
    <ion-card>
      <ion-card-header>
        <ion-card-title>Datos Ingresados</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p><strong>Nombre:</strong> {{ nombre }}</p>
        <p><strong>Email:</strong> {{ email }}</p>
        <p><strong>Teléfono:</strong> {{ telefono }}</p>
      </ion-card-content>
    </ion-card>
  }

</ion-content>
