<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Searchbar Component</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- 1. Searchbar Básico con ngModel -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Searchbar Básico ([(ngModel)])</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-searchbar
        [(ngModel)]="busquedaSimple"
        placeholder="Buscar término..."
        animated="true">
      </ion-searchbar>

      <div class="ion-margin-top">
        <p><strong>Valor ingresado:</strong> {{ busquedaSimple }}</p>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- 2. Filtrado Dinámico con ionInput y Debounce -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Filtrado con Debounce (ionInput)</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-searchbar
        placeholder="Filtrar frutas..."
        [debounce]="300"
        (ionInput)="handleInput($event)"
        showCancelButton="focus">
      </ion-searchbar>
    </ion-card-content>
  </ion-card>

  <!-- Lista de Resultados Filtrados -->
  <ion-list lines="full">
    @for (fruta of frutasFiltradas; track fruta) {
      <ion-item>
        <ion-label>{{ fruta }}</ion-label>
      </ion-item>
    } @empty {
      <ion-item>
        <ion-label color="medium">No se encontraron resultados</ion-label>
      </ion-item>
    }
  </ion-list>

</ion-content>
