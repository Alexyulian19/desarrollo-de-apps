<!-- Menú Lateral -->
<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Menú Lateral</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list lines="none">
      <ion-menu-toggle autoHide="false">
        <ion-item button>
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Inicio</ion-label>
        </ion-item>
        <ion-item button>
          <ion-icon slot="start" name="person-outline"></ion-icon>
          <ion-label>Perfil</ion-label>
        </ion-item>
        <ion-item button>
          <ion-icon slot="start" name="mail-outline"></ion-icon>
          <ion-label>Mensajes</ion-label>
        </ion-item>
        <ion-item button>
          <ion-icon slot="start" name="settings-outline"></ion-icon>
          <ion-label>Ajustes</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Contenido Principal -->
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/home"></ion-back-button>
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Menu Component</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Componente IonMenu</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>
          Presiona el icono del menú o desliza desde el borde de la pantalla para desplegar el menú lateral.
        </p>
      </ion-card-content>
    </ion-card>
  </ion-content>
</div>
